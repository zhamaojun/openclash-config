# OpenClash WORK V2 | Deep > YC/YC2 > Other, country fallback preference
# Based ONLY on validated Work V1.2 (not V1.3 url-test modification).
# Change scope: five national fallback groups only, plus 15 source-tier subgroups.
# All applications, rulesets, provider use, global country order, and Work LB unchanged.
# Country nested fallback can have health-state caveats in Mihomo (#2588).
# MUST verify converted YAML and failed-tier switchover before production.
# If strict preference fails on your core, use existing national url-test or V1.2 backup.
# No embedded subscription URLs, secrets or static node names.

# OpenClash WORK V1.2 | Rule Provider declaration compatibility fix
# Keeps V1.1.1 groups, strategies, filters and provider approach unchanged.
# Fixes 3 missing Aethersailor rule sets via explicit TOML type/ruleset/interval.
# These are remote classical rule-provider URLs, not full inline rules.
# Expected: 3 rule providers and their RULE-SET references in converted YAML.
# If any is missing, do not enable load balancing; inspect converter response.
# No MiSub subscription credentials stored here.

# OpenClash WORK V1.1.1 | SubConverter-Extended remote external configuration
# Date: 2026-10-12
# HOTFIX: external TOML requires [custom] table; old [ruleset] table was ignored.
# Scope: company router only. Source nodes: private MiSub Work subscription URL.
# This TOML contains NO subscription credentials or nodes.
# V1.1 fixes:
# (1) true A/B strategies are declared on custom_groups, no ineffective [Proxy Group].
# (2) country fallback includes nodes of all airport sources, rather than Deep only.
#     With a single provider, strict Deep -> YC -> others order is NOT guaranteed.
#     No extra nested group is added in order to avoid complexity and health issues.
# (3) default nonstandard port stays follow-rules, for manual rollback.
# (4) source and region node pool is regex-dynamic; never promise fastest N.
# IMPORTANT: provider tests are not SOCKS5 gateway performance tests.
# Validate generated YAML strategy/use/filter and runtime OpenClash overlays BEFORE switching.
