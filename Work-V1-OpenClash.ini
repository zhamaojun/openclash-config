[custom]
; ====================================================================
; OpenClash WORK V1.0 (2026-10-12) | external config for SubConverter-Extended
; Input: MiSub Work Clash subscription (private URL, not stored in this file)
; Design: retain V4.1 application rules and V3.2 country policy; change only
;         the nonstandard port exit into safe default + selectable A/B.
; SAFE DEFAULT: 非标端口 -> 遵循规则 -> 漏网之鱼 -> 自动选择
; A/B: 44 observed candidate nodes from the 2026-10-12 export, selected
;      by source Deep / YC / YC2 AND HK / SG / US; count updates with nodes.
; NOT a dynamic top-N speed ranking. Selection must be checked after conversion.
; Provider-based conversion may have different regex behavior than expanded
; source nodes. Inspect generated YAML (use/filter/proxies/strategy) before use.
; Extended INI timeout syntax: interval,timeout_seconds,tolerance_ms.
; Country url-test=300,5,100; fallback=120,5; Work balance=600,5.
; Never commit MiSub subscription URLs, credentials or generated full YAML.
; ====================================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==================== 1. 精确 / 高优先级规则 ====================
; Adobe 保持最前，便于独立控制及可选 REJECT
ruleset=🟥 Adobe,[]GEOSITE,adobe

; 私网必须直连
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private

; 核心 AI：ChatGPT 必须先于通用 AI
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; 核心平台：独立分组，便于排查服务/节点问题
ruleset=📘 Facebook,[]GEOSITE,facebook
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; 通讯 / 远程
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=↔️ TeamViewer,[]GEOSITE,teamviewer

; 工作 / 开发
ruleset=📦 Notion,[]GEOSITE,notion
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare

; 流媒体 / 娱乐
ruleset=🎥 Netflix,[]GEOSITE,netflix
; Steam 必须在 category-games DIRECT 之前，否则会被提前直连吞掉
ruleset=🎮 Steam,[]GEOSITE,steam

; 加密货币：三个交易所统一到一个策略组
ruleset=🪙 加密货币,[]GEOSITE,okx
ruleset=🪙 加密货币,[]GEOSITE,binance
ruleset=🪙 加密货币,[]GEOSITE,bybit

ruleset=🚝 测速工具,[]GEOSITE,category-speedtest

; ==================== 2. Aethersailor 例外补丁 ====================
; 强制代理补丁必须在 CN DIRECT 前，避免 *.cn 例外被提前直连
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical.yaml,28800
; 明确直连补丁
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical.yaml,28800

; ==================== 3. 国内 / 宽泛直连 ====================
; google-cn 放在 Google 总规则前；强制代理例外已由上一段优先处理
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn
; Steam 已在上方单独命中，其余游戏按默认直连
ruleset=DIRECT,[]GEOSITE,category-games
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; ==================== 4. 其余应用规则 ====================
; YouTube 已经在 Google 前面，保持独立分流
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🍎 Apple,[]GEOSITE,apple

; 宽泛分类放在 Facebook/TikTok/Instagram/Telegram 等精确规则之后
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; GFW 及最后兜底
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
ruleset=🐟 漏网之鱼,[]FINAL

; WORK V1: nonstandard port affects ANY flow matched by Custom_Port_Direct,
; not only AdsPower. Keep follow-rules as default. Test at quiet hours.
; Groups are FLAT: matched real airport nodes, no nested url-test/fallback.
; ==================== 5. 应用策略组（B 方案） ====================
